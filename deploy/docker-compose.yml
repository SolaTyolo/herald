x-herald-build: &herald-build
  context: ..
  dockerfile: deploy/Dockerfile

x-herald-env: &herald-env
  DEV_MODE: "true"
  API_KEY: herald-dev-key
  STORE_TYPE: db
  DB_DRIVER: postgres
  DATABASE_URL: postgres://herald:herald@postgres:5432/herald?sslmode=disable
  REDIS_ADDR: redis:6379
  QUEUE_MODE: asynq
  DELIVERY_RESULT_MODE: async
  PROVIDERS_CONFIG: /app/config/providers.yaml
  # Builtin SMTP — pass from host/.env via compose interpolation (see Makefile --env-file)
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: herald
      POSTGRES_DB: herald
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herald"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["app"]
    build: *herald-build
    image: herald:local
    environment:
      <<: *herald-env
      HTTP_ADDR: ":8080"
    ports:
      - "8188:8080"
    volumes:
      - ../config/providers.yaml:/app/config/providers.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    profiles: ["app"]
    build: *herald-build
    image: herald:local
    command: ["/app/herald-worker"]
    environment:
      <<: *herald-env
    volumes:
      - ../config/providers.yaml:/app/config/providers.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  pgdata:
